<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang xử lý đăng nhập...</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        padding: 48px 40px;
        width: 400px;
        max-width: 95vw;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 24px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h2 {
        color: #1a1a1a;
        margin-bottom: 8px;
      }
      p {
        color: #6b7280;
        font-size: 0.95rem;
      }

      .icon-success {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .icon-error {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .token-box {
        background: #f8fafc;
        border-radius: 8px;
        padding: 14px;
        border: 1px solid #e2e8f0;
        margin: 20px 0;
        text-align: left;
      }
      .token-box h4 {
        margin-bottom: 8px;
        color: #374151;
        font-size: 0.88rem;
      }
      .token-box pre {
        font-size: 0.75rem;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: #4f46e5;
        color: #fff;
      }
      .btn-primary:hover {
        background: #4338ca;
      }
      .btn-outline {
        background: #fff;
        border: 1.5px solid #4f46e5;
        color: #4f46e5;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h2 id="title">Đang xử lý...</h2>
      <p id="subtitle">Vui lòng chờ trong giây lát</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const refreshToken = params.get("refreshToken");
      const error = params.get("error");
      const card = document.getElementById("card");

      function decodeJwtPayload(jwt) {
        try {
          const base64 = jwt
            .split(".")[1]
            .replace(/-/g, "+")
            .replace(/_/g, "/");
          return JSON.parse(atob(base64));
        } catch {
          return null;
        }
      }

      if (error || (!token && !refreshToken)) {
        card.innerHTML = `
        <div class="icon-error">❌</div>
        <h2>Đăng nhập thất bại</h2>
        <p style="margin-top:8px">Có lỗi xảy ra trong quá trình đăng nhập bằng Google.</p>
        <p style="margin-top:4px;color:#ef4444;font-size:.85rem">${error || "Không nhận được token"}</p>
        <a href="/" class="btn btn-primary" style="margin-top:20px">Thử lại</a>
      `;
      } else {
        // Store tokens
        localStorage.setItem("token", token);
        localStorage.setItem("refreshToken", refreshToken);

        const payload = decodeJwtPayload(token);
        const displayInfo = payload
          ? {
              email: payload.email,
              username: payload.username,
              role: payload.role,
            }
          : { token: token.substring(0, 40) + "..." };

        card.innerHTML = `
        <div class="icon-success">🎉</div>
        <h2>Đăng nhập thành công!</h2>
        <p style="margin-top:8px">Chào mừng bạn quay lại.</p>
        <div class="token-box">
          <h4>Thông tin tài khoản:</h4>
          <pre>${JSON.stringify(displayInfo, null, 2)}</pre>
        </div>
        <div class="token-box">
          <h4>Access Token (đã lưu vào localStorage):</h4>
          <pre>${token}</pre>
        </div>
        <br/>
        <a href="/" class="btn btn-primary">Về trang chính</a>
        <button class="btn btn-outline" onclick="handleLogout()">Đăng xuất</button>
      `;
      }

      const API = "http://localhost:8081";

      async function handleLogout() {
        const t = localStorage.getItem("token");
        if (t) {
          try {
            await fetch(`${API}/v1/auth/logout`, {
              method: "GET",
              headers: { Authorization: `Bearer ${t}` },
            });
          } catch {}
        }
        localStorage.removeItem("token");
        localStorage.removeItem("refreshToken");
        window.location.href = "/";
      }
    </script>
  </body>
</html>
