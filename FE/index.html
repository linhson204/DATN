<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        padding: 36px 40px;
        width: 420px;
        max-width: 95vw;
      }

      h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #1a1a1a;
        font-size: 1.5rem;
      }

      .tabs {
        display: flex;
        margin-bottom: 28px;
        border-bottom: 2px solid #e5e7eb;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        font-weight: 600;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
      }
      .tab.active {
        color: #4f46e5;
        border-bottom-color: #4f46e5;
      }

      .form-section {
        display: none;
      }
      .form-section.active {
        display: block;
      }

      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.88rem;
        color: #374151;
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: border 0.2s;
        outline: none;
      }
      input:focus {
        border-color: #4f46e5;
      }

      .btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 4px;
      }
      .btn-primary {
        background: #4f46e5;
        color: #fff;
      }
      .btn-primary:hover {
        background: #4338ca;
      }
      .btn-primary:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
      }

      .divider {
        text-align: center;
        margin: 18px 0;
        color: #9ca3af;
        font-size: 0.85rem;
        position: relative;
      }
      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 42%;
        height: 1px;
        background: #e5e7eb;
      }
      .divider::before {
        left: 0;
      }
      .divider::after {
        right: 0;
      }

      .btn-google {
        width: 100%;
        padding: 11px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background 0.2s;
        color: #374151;
      }
      .btn-google:hover {
        background: #f9fafb;
      }

      .btn-google svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .alert {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.88rem;
        margin-bottom: 14px;
        display: none;
      }
      .alert.show {
        display: block;
      }
      .alert-error {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fca5a5;
      }
      .alert-success {
        background: #f0fdf4;
        color: #15803d;
        border: 1px solid #86efac;
      }

      #result-box {
        display: none;
        margin-top: 20px;
        background: #f8fafc;
        border-radius: 8px;
        padding: 14px;
        border: 1px solid #e2e8f0;
      }
      #result-box h4 {
        margin-bottom: 8px;
        color: #374151;
        font-size: 0.9rem;
      }
      #result-box pre {
        font-size: 0.78rem;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .logout-row {
        display: none;
        margin-top: 16px;
        text-align: center;
      }
      .btn-logout {
        background: none;
        border: 1.5px solid #ef4444;
        color: #ef4444;
        padding: 8px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.2s;
      }
      .btn-logout:hover {
        background: #fef2f2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🔐 Auth Test</h2>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
        <div class="tab" onclick="switchTab('register')">Đăng ký</div>
      </div>

      <!-- LOGIN -->
      <div id="login-section" class="form-section active">
        <div id="login-alert" class="alert"></div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="example@email.com"
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            placeholder="Tối thiểu 6 ký tự"
          />
        </div>
        <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">
          Đăng nhập
        </button>

        <div class="divider">hoặc</div>

        <button class="btn-google" onclick="loginWithGoogle()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Đăng nhập bằng Google
        </button>
      </div>

      <!-- REGISTER -->
      <div id="register-section" class="form-section">
        <div id="register-alert" class="alert"></div>

        <div class="form-group">
          <label>Tên đăng nhập <span style="color: red">*</span></label>
          <input type="text" id="reg-username" placeholder="Từ 3-50 ký tự" />
        </div>
        <div class="form-group">
          <label>Email <span style="color: red">*</span></label>
          <input type="email" id="reg-email" placeholder="example@email.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu <span style="color: red">*</span></label>
          <input
            type="password"
            id="reg-password"
            placeholder="Tối thiểu 6 ký tự"
          />
        </div>
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" id="reg-fullname" placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="tel" id="reg-phone" placeholder="0901234567" />
        </div>
        <button
          class="btn btn-primary"
          id="register-btn"
          onclick="handleRegister()"
        >
          Đăng ký
        </button>

        <div class="divider">hoặc</div>

        <button class="btn-google" onclick="loginWithGoogle()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Đăng ký / Đăng nhập bằng Google
        </button>
      </div>

      <!-- Result -->
      <div id="result-box">
        <h4>✅ Phản hồi từ API:</h4>
        <pre id="result-pre"></pre>
      </div>

      <div class="logout-row" id="logout-row">
        <button class="btn-logout" onclick="handleLogout()">Đăng xuất</button>
      </div>
    </div>

    <script>
      const API = "http://localhost:8081";

      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".form-section")
          .forEach((s) => s.classList.remove("active"));
        document
          .querySelector(`.tab:nth-child(${tab === "login" ? 1 : 2})`)
          .classList.add("active");
        document.getElementById(tab + "-section").classList.add("active");
      }

      function showAlert(id, msg, type = "error") {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className = `alert alert-${type} show`;
      }

      function hideAlert(id) {
        document.getElementById(id).className = "alert";
      }

      function showResult(data) {
        const box = document.getElementById("result-box");
        box.style.display = "block";
        document.getElementById("result-pre").textContent = JSON.stringify(
          data,
          null,
          2,
        );
      }

      function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading
          ? "Đang xử lý..."
          : btnId === "login-btn"
            ? "Đăng nhập"
            : "Đăng ký";
      }

      async function handleLogin() {
        hideAlert("login-alert");
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        if (!email || !password) {
          showAlert("login-alert", "Vui lòng nhập đầy đủ email và mật khẩu.");
          return;
        }

        setLoading("login-btn", true);
        try {
          const res = await fetch(`${API}/v1/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("refreshToken", data.refreshToken);
            showAlert("login-alert", "🎉 Đăng nhập thành công!", "success");
            showResult(data);
            document.getElementById("logout-row").style.display = "block";
          } else {
            showAlert(
              "login-alert",
              data.message || data.error || "Đăng nhập thất bại",
            );
            showResult(data);
          }
        } catch (e) {
          showAlert(
            "login-alert",
            "Không thể kết nối tới server. Hãy chắc chắn backend đang chạy.",
          );
        } finally {
          setLoading("login-btn", false);
        }
      }

      async function handleRegister() {
        hideAlert("register-alert");
        const username = document.getElementById("reg-username").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const fullName = document.getElementById("reg-fullname").value.trim();
        const phoneNumber = document.getElementById("reg-phone").value.trim();

        if (!username || !email || !password) {
          showAlert(
            "register-alert",
            "Vui lòng nhập đầy đủ các trường bắt buộc (*).",
          );
          return;
        }

        setLoading("register-btn", true);
        const body = { username, email, password };
        if (fullName) body.fullName = fullName;
        if (phoneNumber) body.phoneNumber = phoneNumber;

        try {
          const res = await fetch(`${API}/v1/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (res.ok) {
            showAlert("register-alert", "🎉 Đăng ký thành công!", "success");
            showResult(data);
          } else {
            showAlert(
              "register-alert",
              data.message || data.error || "Đăng ký thất bại",
            );
            showResult(data);
          }
        } catch (e) {
          showAlert(
            "register-alert",
            "Không thể kết nối tới server. Hãy chắc chắn backend đang chạy.",
          );
        } finally {
          setLoading("register-btn", false);
        }
      }

      function loginWithGoogle() {
        window.location.href = `${API}/oauth2/authorization/google`;
      }

      async function handleLogout() {
        const token = localStorage.getItem("token");
        if (!token) return;
        try {
          await fetch(`${API}/v1/auth/logout`, {
            method: "GET",
            headers: { Authorization: `Bearer ${token}` },
          });
        } finally {
          localStorage.removeItem("token");
          localStorage.removeItem("refreshToken");
          document.getElementById("logout-row").style.display = "none";
          document.getElementById("result-box").style.display = "none";
          alert("Đã đăng xuất!");
        }
      }

      // Check if already logged in
      window.addEventListener("load", () => {
        if (localStorage.getItem("token")) {
          document.getElementById("logout-row").style.display = "block";
        }
      });

      // Enter key support
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const activeSection = document.querySelector(".form-section.active");
          if (activeSection?.id === "login-section") handleLogin();
          else if (activeSection?.id === "register-section") handleRegister();
        }
      });
    </script>
  </body>
</html>
